  .modulex-once-sonra-kaydirici--ojs .modulex-once-sonra-kaydirici-katman--sonra .modulex-once-sonra-kaydirici-etiket { inset-inline-start: auto; inset-inline-end: 14px; }

  .modulex-once-sonra-kaydirici-tutamac .material-symbols-outlined { font-size: 26px; }

  .modulex-once-sonra-kaydirici-cerceve:has(.modulex-once-sonra-kaydirici-surgu:focus-visible) .modulex-once-sonra-kaydirici-tutamac { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-once-sonra-kaydirici-surgu { position: absolute; inset: 0; z-index: 3; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: ew-resize; touch-action: pan-y; -webkit-appearance: none; appearance: none; background: transparent; }
  .modulex-once-sonra-kaydirici-not { color: --muted--; font-size: 0.95rem; text-align: center; }
  .modulex-once-sonra-kaydirici-tek { display: grid; gap: 12px; max-width: 900px; margin-inline: auto; }
  .modulex-once-sonra-kaydirici-tek .modulex-once-sonra-kaydirici-g { border-radius: --yuvarlak--; }

  .modulex-once-sonra-kaydirici-kucuk { display: grid; gap: 8px; padding: 8px; border: 1.5px solid --cizgi--; border-radius: calc(--yuvarlak-- * 0.7); background: --kartBg--; color: --text--; font: inherit; text-align: start; transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease; }
  .modulex-once-sonra-kaydirici-kucuk:hover { transform: translateY(-2px); border-color: --accent--; }
  .modulex-once-sonra-kaydirici-kucuk[aria-pressed="true"] { border-color: --accent--; box-shadow: inset 0 0 0 1px --accent--; }
  .modulex-once-sonra-kaydirici-kyari { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; overflow: hidden; border-radius: 8px; }
  .modulex-once-sonra-kaydirici-kyari img, .modulex-once-sonra-kaydirici-kyer { display: block; width: 100%; aspect-ratio: 3 / 4; height: auto; object-fit: cover; }

  .modulex-once-sonra-kaydirici-yer .material-symbols-outlined { font-size: 40px; }

  .modulex-once-sonra-kaydirici-ok:hover:not(:disabled) { background: --accent--; color: --accentText--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-once-sonra-kaydirici :is(.modulex-once-sonra-kaydirici-baslik, .modulex-once-sonra-kaydirici-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-once-sonra-kaydirici-baslik { line-height: 1.35; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-once-sonra-kaydirici *, .modulex-once-sonra-kaydirici *::before, .modulex-once-sonra-kaydirici *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-once-sonra-kaydirici";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const oncesonra = (s, P) => {
        const ciftler = [...s.querySelectorAll("[data-cift]")];
        if (!ciftler.length) return;
        s.classList.add(P + "--ojs");
        ciftler.forEach((c) => {
          const r = c.querySelector("input[type=range]");
          const yuz = c.querySelector("." + P + "-cerceve");
          if (!r || !yuz) return;
          r.hidden = false;
          const yaz = () => {
            const v = Math.min(100, Math.max(0, Number(r.value) || 0));
            yuz.style.setProperty("--konum", v + "%");
            r.setAttribute("aria-valuetext", Math.round(v) + "%");
          };
          r.addEventListener("input", yaz);
          yaz();
        });
        const b = [...s.querySelectorAll("[data-cift-sec]")];
        if (b.length < 2) return;
        const sec = (n, odak) => {
          b.forEach((x, j) => { x.setAttribute("aria-pressed", String(j === n)); x.tabIndex = j === n ? 0 : -1; });
          ciftler.forEach((c, j) => { c.hidden = j !== n; });
          if (odak) b[n].focus();
        };
        b.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            let n = -1;
            if (e.key === "ArrowDown" || e.key === (rtl ? "ArrowLeft" : "ArrowRight")) n = (i + 1) % b.length;
            else if (e.key === "ArrowUp" || e.key === (rtl ? "ArrowRight" : "ArrowLeft")) n = (i - 1 + b.length) % b.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = b.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
        sec(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      oncesonra(s, P, az);
    });
  })();
</script>
